<!doctype html><html lang="zh"><meta charset="utf-8"><title>Pin Geometry Review V2</title>
<style>body{font:16px system-ui;background:#f5f7fa;color:#203148;margin:22px;max-width:1280px}main{display:grid;grid-template-columns:minmax(320px,600px) minmax(340px,1fr);gap:24px}canvas{width:100%;image-rendering:pixelated;border:1px solid #bbb;cursor:crosshair;background:white}label{display:block;margin:10px 0}select,input,button,textarea{font:inherit;padding:6px}textarea{width:95%;height:70px}p{line-height:1.6}.notice{background:#fff2cc;padding:12px}pre{white-space:pre-wrap;overflow:auto;max-height:280px;font-size:12px}#manual{padding:10px;background:white;font-size:14px}button{margin:5px}@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}body{margin:14px}}</style>
<h1>Pin Geometry Review V2</h1><p class="notice">先观察像素，再揭示 GT。两位审核者分别从空白表开始，互不查看对方记录。无法区分外端与接点时选“连续无边界”或“未确定”，可留空点位。此工具不修改解析结果，也不会把 CAD 属性当成可见真值。</p>
<p><a href="index.html?pass=A">第一遍空白表</a> · <a href="index.html?pass=B">第二遍空白表（反向顺序）</a></p>
<label>审核者 <input id="reviewer" placeholder="审核者唯一标识"></label><select id="domain"><option value="ALL">全部域</option><option>gt10</option><option>pcb55</option><option>Freeze-A1</option></select><button id="prev">上一例</button><button id="next">下一例</button><span id="count"></span>
<main><section><h2 id="title"></h2><canvas id="canvas"></canvas><label>图层 <select id="layer"><option value="crop">原图</option><option value="skeleton_crop">骨架（含文字）</option><option value="wire_crop">解析/CAD wire 候选</option></select></label>
<label><input type="checkbox" id="reveal">揭示 GT、预测与 CAD 参考（不是人工观察结果）</label><label>点击记录 <select id="point"><option value="body">主体边</option><option value="tip">可见外端</option><option value="contact">可见 pin/wire 接点</option></select></label><button id="clear">清除本例观察点</button><div id="manual"></div><pre id="reference"></pre></section>
<section><h2>独立观察记录</h2><label>确定性 <select id="certainty"><option value="unknown">unknown：尚不确定</option><option value="ambiguous">ambiguous：存在歧义</option><option value="clear">clear：像素可明确辨认</option></select></label>
<label>位置结论 <select id="conclusion"><option value="uncertain">uncertain：未确定</option><option value="body">body：主体边</option><option value="tip">tip：可见外端</option><option value="contact">contact：可见接点</option><option value="continuous-no-boundary">continuous-no-boundary：连续、无可见边界</option></select></label>
<label>实际观察到的引脚侧 <select id="side"><option value="unknown">未确认（不沿用模型方向）</option><option value="left">左侧</option><option value="right">右侧</option><option value="top">上侧</option><option value="bottom">下侧</option></select></label>
<label>候选合法性 <select id="classification"><option value="uncertain">未确定</option><option value="same-physical-pin">同一根 pin（定位是否正确另算）</option><option value="wrong-pin">同组件另一根 pin</option><option value="false-endpoint">假端点候选</option><option value="duplicate">旧 pin / 重复候选</option><option value="component-mismatch">组件不匹配 / 标注歧义</option></select></label>
<label>实际观察到的 pin 编号 <input id="number" placeholder="不可见时留空"></label><label>同一根 pin 的核验依据 <textarea id="evidence" placeholder="说明笔画、可见编号和所属器件依据；不能只写最近 GT"></textarea></label><label>备注 <textarea id="note"></textarea></label>
<label><input type="checkbox" id="complete">已完成本遍实际观察（允许结论为不确定）</label><button id="export">导出本遍审核</button><p id="message">仅凭近邻 GT 不计算 Semantic-Eligible P5；需要独立两遍一致、确切可见编号与同 pin 证据。未审核统计保持 null。</p></section></main>
<script>
const data=__DATA__,cases=new URLSearchParams(location.search).get('pass')==='B'?[...data.cases].reverse():data.cases,reviews={},$=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let visible=cases,index=0,current,img=new Image(),reviewOwner=null;
const colors={body:'#ac23b2',tip:'#185ce0',contact:'#13854a',dataset_GT:'#af8200',predicted:'#e62f3f'};
function entry(){return reviews[current.id]||(reviews[current.id]={observed_points:{},certainty:'unknown',conclusion:'uncertain',candidate_class:'uncertain',review_complete:false,reference_seen_before_observations:false});}
function stash(){if(!current)return;Object.assign(entry(),{certainty:$('certainty').value,conclusion:$('conclusion').value,observed_side:$('side').value,candidate_class:$('classification').value,observed_pin_number:$('number').value.trim(),same_pin_evidence_note:$('evidence').value,note:$('note').value,review_complete:$('complete').checked});}
function draw(){if(!current||!img.complete)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);let pts={...entry().observed_points};if($('reveal').checked){for(let k of ['predicted','dataset_GT'])if(current.points[k])pts[k]=current.points[k];}
for(const [k,p]of Object.entries(pts)){let x=p[0]-current.crop_origin_xy[0],y=p[1]-current.crop_origin_xy[1];ctx.strokeStyle=colors[k]||'#555';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();ctx.font='6px sans-serif';ctx.fillStyle=colors[k]||'#555';ctx.fillText(k,x+3,y-3);}
$('manual').textContent='人工观察点：'+JSON.stringify(entry().observed_points);$('reference').textContent=$('reveal').checked?JSON.stringify({points:current.points,nearest_GT_error_vector:current.error_vector,warning:'近邻诊断不是同一 pin 身份认证；CAD 与 observed truth 分层',design_truth:current.design_truth},null,2):'参考已隐藏。请从可见像素独立记录；骨架端点可能来自文字。';}
function show(){current=visible[index];if(!current)return;let r=entry();$('title').textContent=current.domain+' / '+current.case+' / '+current.component+' / 裁图';$('count').textContent=(index+1)+' / '+visible.length;for(const [id,key]of Object.entries({certainty:'certainty',conclusion:'conclusion',side:'observed_side',classification:'candidate_class',number:'observed_pin_number',evidence:'same_pin_evidence_note',note:'note'}))$(id).value=r[key]||((id==='certainty'||id==='side')?'unknown':(id==='conclusion'||id==='classification')?'uncertain':'');$('complete').checked=!!r.review_complete;$('reveal').checked=false;canvas.width=current.crop_size[0];canvas.height=current.crop_size[1];img.onload=draw;img.src=current[$('layer').value];draw();}
function move(d){stash();index=(index+d+visible.length)%visible.length;show();}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('domain').onchange=()=>{stash();visible=cases.filter(c=>$('domain').value==='ALL'||c.domain===$('domain').value);index=0;show();};$('layer').onchange=()=>{stash();let reveal=$('reveal').checked;show();$('reveal').checked=reveal;draw();};$('reveal').onchange=()=>{stash();if($('reveal').checked&&Object.keys(entry().observed_points).length===0)entry().reference_seen_before_observations=true;draw();};
canvas.onclick=e=>{stash();let b=canvas.getBoundingClientRect();entry().observed_points[$('point').value]=[Math.min(current.crop_origin_xy[0]+canvas.width-1,Math.max(current.crop_origin_xy[0],Math.round((e.clientX-b.left)*canvas.width/b.width+current.crop_origin_xy[0]))),Math.min(current.crop_origin_xy[1]+canvas.height-1,Math.max(current.crop_origin_xy[1],Math.round((e.clientY-b.top)*canvas.height/b.height+current.crop_origin_xy[1])))];draw();};$('clear').onclick=()=>{entry().observed_points={};draw();};
$('export').onclick=()=>{stash();let reviewer=$('reviewer').value.trim();if(!reviewer){$('message').textContent='需要真实审核者标识才能导出，代理不能代签人工审核。';return;}if(reviewOwner&&reviewOwner!==reviewer){$('message').textContent='不同审核者须重新打开空白页面，不能复用另一人的记录。';return;}reviewOwner=reviewer;let entries=Object.entries(reviews).map(([id,r])=>({id,...r,case_evidence_sha256:cases.find(c=>c.id===id).case_evidence_sha256}));let obj={schema:'pin-geometry-review-v2',coordinate_system:'image top-left, integer pixel',reviewer_id:reviewer,reviewer_kind:'human-self-declared',status:'evidence-draft-not-frozen',date:new Date().toISOString(),entries,protocol:data.protocol};let url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='pin-geometry-review-v2-'+reviewer.replace(/[^a-zA-Z0-9_-]/g,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};show();
</script></html>

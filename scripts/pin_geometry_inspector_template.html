<!doctype html><html lang="zh"><meta charset="utf-8"><title>Pin Geometry Inspector</title>
<style>body{font:16px system-ui;margin:24px;background:#f5f7fa;color:#182536}main{display:grid;grid-template-columns:minmax(380px,660px) minmax(350px,1fr);gap:24px}canvas{width:100%;max-width:640px;image-rendering:pixelated;background:white;border:1px solid #aaa;cursor:crosshair}button,select,input,textarea{font:inherit;margin:5px;padding:5px}table{border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}pre{white-space:pre-wrap;max-height:300px;overflow:auto}#notice{padding:12px;background:#fff3cf}label{display:block}textarea{width:90%;height:75px}#legend span{margin-right:10px}a{color:#176ac3}</style>
<style>@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}body{margin:16px}h1{font-size:25px}#legend span{display:inline-block}table{width:100%;font-size:12px}pre{font-size:12px}}</style>
<h1>Pin Geometry Inspector</h1><p id="notice">离线标注校准。自动主体边、骨架端点、wire 投影均为候选证据；不修改解析结果。Freeze-A 的 CAD 外端是几何参考，尚无比赛 GT。当前所有记录未人工审核。</p>
<select id="domain"><option value="ALL">全部域</option><option>gt10</option><option>pcb55</option><option>Freeze-A1</option></select>
<button id="prev">上一例</button><button id="next">下一例</button><span id="count"></span>
<main><section><h2 id="title"></h2><div id="legend"></div><canvas id="canvas"></canvas>
<label>显示图层 <select id="layer"><option value="crop">原图</option><option value="skeleton_crop">全部墨迹骨架</option><option value="wire_crop">解析/CAD wire 图层</option></select></label>
<label>点击标记位置 <select id="point"><option value="body_edge">主体与 pin 相交处</option><option value="stroke_outer_tip">可确认的 pin 外端</option><option value="wire_contact">可确认的 pin/wire 接点</option><option value="logical_anchor">其他逻辑标注锚点</option></select></label>
<button id="clear">清除本例人工点</button><p>仅在像素证据可以区分时点击；连续 pin/wire 无可见边界时保持未知。青色骨架包含文字，不能自动视作 pin。</p>
</section><section><h2>位置与距离</h2><table id="dist"></table><pre id="detail"></pre>
<label>本例 pin 坐标定义 <select id="convention"><option value="unresolved">未确定</option><option value="body_edge">主体边/引脚基部</option><option value="stroke_outer_tip">pin 笔画外端</option><option value="wire_contact">pin/wire 接点</option><option value="logical_anchor">其他逻辑锚点</option><option value="ambiguous">像素不可区分</option></select></label>
<label>备注 <textarea id="note"></textarea></label><label><input type="checkbox" id="checked">我已实际查看本例并完成此遍审核</label>
<label>审核者标识 <input id="reviewer" placeholder="姓名或团队唯一标识"></label>
<button id="export">导出当前审核 JSON</button><p id="message">导出记录是审核证据草稿，不会自动计入 Freeze-A 或改变 GT。需独立第二遍核对、来源修订与设计族排除后才可冻结。</p></section></main>
<script>
const data=__DATA__, cases=data.cases, reviews={},colors={predicted:'#e5293c',dataset_GT:'#b58100',body_edge_candidate:'#a520c8',stroke_outer_tip:'#1760df',CAD_outer_tip:'#1760df',parsed_wire_contact_candidate:'#138331',skeleton_endpoint_candidate:'#00a2ac'};
const $=id=>document.getElementById(id), c=$('canvas'),ctx=c.getContext('2d');let visible=cases,index=0,current,image=new Image();
function stash(){if(!current)return;let r=reviews[current.id]||{manual_points:{}};Object.assign(r,{coordinate_convention:$('convention').value,note:$('note').value,review_complete:$('checked').checked});reviews[current.id]=r;}
function draw(){if(!current)return;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(image,0,0);for(const [k,p] of Object.entries(current.points)){if(!p)continue;let x=p[0]-current.crop_origin_xy[0],y=p[1]-current.crop_origin_xy[1];ctx.strokeStyle=colors[k]||'#555';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x+5,y);ctx.moveTo(x,y-5);ctx.lineTo(x,y+5);ctx.stroke();}for(const [k,p] of Object.entries((reviews[current.id]||{}).manual_points||{})){let x=p[0]-current.crop_origin_xy[0],y=p[1]-current.crop_origin_xy[1];ctx.fillStyle='#000';ctx.fillRect(x-2,y-2,4,4);ctx.font='6px sans-serif';ctx.fillText(k,x+3,y-3);}}
function show(){current=visible[index];if(!current)return;$('title').textContent=current.domain+' / '+current.case+' / '+current.component+' / '+(current.candidate_id||current.CAD_number);$('count').textContent=(index+1)+' / '+visible.length;
let r=reviews[current.id]||{manual_points:{}};$('convention').value=r.coordinate_convention||'unresolved';$('note').value=r.note||'';$('checked').checked=!!r.review_complete;
c.width=current.crop_size[0];c.height=current.crop_size[1];image.onload=draw;image.src=current[$('layer').value];
$('legend').replaceChildren();for(const [k,p] of Object.entries(current.points)){if(!p)continue;let s=document.createElement('span');s.style.color=colors[k]||'#555';s.textContent=k;$('legend').appendChild(s);}
$('dist').replaceChildren();let tr=document.createElement('tr');for(const label of ['点定义','绝对坐标（左上）','至 dataset GT 距离']){let th=document.createElement('th');th.textContent=label;tr.appendChild(th);}$('dist').appendChild(tr);
for(const [k,p] of Object.entries(current.points)){let tr=document.createElement('tr');let d=current.distance_table_to_dataset_GT[k];for(const text of [k,p?p.map(v=>v.toFixed(2)).join(', '):'未知',d==null?'未定义':d.toFixed(3)+' px']){let td=document.createElement('td');td.textContent=text;tr.appendChild(td);}$('dist').appendChild(tr);}
$('detail').textContent=JSON.stringify({selection:current.selection,side:current.side,state:current.pin_state_proxy,grade:current.grade,error_vector:current.error_vector,GT_pin_nearest:current.GT_pin_nearest,number:current.CAD_number,name:current.CAD_name,text_candidates:current.local_text_candidates,skeleton_semantics:current.skeleton_semantics},null,2);}
function move(delta){stash();index=(index+delta+visible.length)%visible.length;show();}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('domain').onchange=()=>{stash();visible=cases.filter(r=>$('domain').value==='ALL'||r.domain===$('domain').value);index=0;show();};$('layer').onchange=()=>{stash();show();};
c.onclick=e=>{stash();let rect=c.getBoundingClientRect(),p=[Math.round((e.clientX-rect.left)*c.width/rect.width+current.crop_origin_xy[0]),Math.round((e.clientY-rect.top)*c.height/rect.height+current.crop_origin_xy[1])];reviews[current.id].manual_points[$('point').value]=p;draw();};
$('clear').onclick=()=>{stash();reviews[current.id].manual_points={};draw();};
$('export').onclick=()=>{stash();let reviewer=$('reviewer').value.trim();if(!reviewer){$('message').textContent='请填写审核者标识；未填写的记录不能成为审核证据。';return;}let entries=Object.entries(reviews).map(([id,r])=>{let source=cases.find(c=>c.id===id);return {id,...r,source_image_sha256:source.source_image_sha256,source_GT_sha256:source.source_GT_sha256||null,source_annotation_sha256:source.source_annotation_sha256||null,crop_sha256:source.crop_sha256};});let obj={schema:'pin-point-definition-review-v1',coordinate_system:'image top-left, integer pixel',reviewer_id:reviewer,reviewer_kind:'human-self-declared',status:'review-evidence-draft-not-frozen',review_date:new Date().toISOString(),protocol:data.protocol,entries};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pin-point-definition-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};show();
</script></html>
